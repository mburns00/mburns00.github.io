<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <div class="scroll-progress" id="scrollProgress"></div>
  {% include header.html %}
  <main id="main-content" class="site-content">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/effects.js' | relative_url }}"></script>
  <script>
    // Scroll progress bar + header elevation
    (function() {
      var bar = document.getElementById('scrollProgress');
      var header = document.querySelector('.site-header');
      function update() {
        var scrolled = window.scrollY;
        var height = document.documentElement.scrollHeight - window.innerHeight;
        var pct = height > 0 ? (scrolled / height) * 100 : 0;
        if (bar) bar.style.width = pct + '%';
        if (header) {
          if (scrolled > 16) header.classList.add('scrolled');
          else header.classList.remove('scrolled');
        }
      }
      window.addEventListener('scroll', update, { passive: true });
      window.addEventListener('resize', update);
      update();
    })();

    // Dropdown nav — click/tap toggle + keyboard support (hover still works via pure CSS)
    (function() {
      var triggers = document.querySelectorAll('[data-dropdown-trigger]');
      triggers.forEach(function(trigger) {
        var parent = trigger.closest('.has-dropdown');
        if (!parent) return;

        // Tap-to-toggle on touch devices (first tap opens dropdown, second tap navigates)
        trigger.addEventListener('click', function(e) {
          var isOpen = parent.classList.contains('open');
          var hasTouch = matchMedia('(hover: none)').matches;
          if (hasTouch && !isOpen) {
            e.preventDefault();
            document.querySelectorAll('.has-dropdown.open').forEach(function(el) { el.classList.remove('open'); });
            parent.classList.add('open');
            trigger.setAttribute('aria-expanded', 'true');
          }
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
          if (!parent.contains(e.target)) {
            parent.classList.remove('open');
            trigger.setAttribute('aria-expanded', 'false');
          }
        });

        // Esc closes
        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape') {
            parent.classList.remove('open');
            trigger.setAttribute('aria-expanded', 'false');
          }
        });
      });
    })();
  </script>
</body>
</html>
